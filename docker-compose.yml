services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: card
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d card"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip
      - "0.0.0.0"
      - --ui-ip
      - "0.0.0.0"
      # Keeps workflow history across restarts; the default is in memory.
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  temporal_data:
